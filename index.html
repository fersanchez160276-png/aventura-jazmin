<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif; background: linear-gradient(180deg,#FDF6E3 0%,#FCEFD4 100%); min-height: 100vh; color: #4A3728; user-select: none; }

  .pantalla { display: none; padding: 20px 16px 40px; max-width: 700px; margin: 0 auto; text-align: center; }
  .pantalla.activa { display: block; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; max-width: 700px; margin: 0 auto; }
  .btn-casa { font-size: 2rem; background: #fff; border: 3px solid #F0B429; border-radius: 50%; width: 62px; height: 62px; cursor: pointer; }
  .estrellas { background: #fff; border: 3px solid #F0B429; border-radius: 30px; padding: 10px 20px; font-size: 1.6rem; font-weight: bold; color: #B8860B; }

  h1 { font-size: 2.2rem; color: #7B4EA8; margin: 10px 0 4px; }
  .subtitulo { font-size: 1.2rem; color: #9C7A5B; margin-bottom: 20px; }
  .mascota { font-size: 6rem; animation: flotar 2.5s ease-in-out infinite; display: inline-block; }
  @keyframes flotar { 0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)} }

  .menu-juegos { display: flex; flex-direction: column; gap: 18px; margin-top: 16px; }
  .btn-juego { display: flex; align-items: center; gap: 16px; background: #fff; border: 4px solid; border-radius: 24px; padding: 20px 22px; cursor: pointer; font-family: inherit; text-align: left; transition: transform 0.15s; box-shadow: 0 5px 0 rgba(0,0,0,0.08); }
  .btn-juego:active { transform: scale(0.97); }
  .btn-juego .icono { font-size: 3.2rem; }
  .btn-juego .info { flex: 1; }
  .btn-juego .nombre { font-size: 1.4rem; font-weight: bold; display: block; }
  .btn-juego .nivel-info { font-size: 1rem; color: #9C7A5B; display: block; margin-top: 3px; }
  .mini-barra { background: #EFE6D5; border-radius: 10px; height: 12px; margin-top: 8px; overflow: hidden; }
  .mini-fill { height: 12px; border-radius: 10px; transition: width 0.5s; }

  .nivel-badge { display: inline-block; background: #7B4EA8; color: #fff; font-size: 1.1rem; font-weight: bold; border-radius: 30px; padding: 8px 22px; margin-bottom: 10px; }
  .instruccion { font-size: 1.5rem; font-weight: bold; margin: 10px 0 8px; color: #5B4636; }
  .btn-oir { font-size: 1.3rem; background: #7B4EA8; color: #fff; border: none; border-radius: 40px; padding: 16px 32px; cursor: pointer; font-family: inherit; font-weight: bold; margin: 8px 0 18px; box-shadow: 0 4px 0 #5A3580; }
  .btn-oir:active { transform: translateY(3px); box-shadow: 0 1px 0 #5A3580; }
  .dibujo-grande { font-size: 8rem; margin: 4px 0; }

  .opciones { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
  .opciones.fila { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .opcion { background: #fff; border: 4px solid #C9E4CA; border-radius: 20px; padding: 20px 26px; font-size: 2.2rem; font-weight: bold; letter-spacing: 3px; cursor: pointer; font-family: inherit; color: #4A3728; box-shadow: 0 5px 0 rgba(0,0,0,0.08); transition: transform 0.15s; min-width: 140px; }
  .opcion:active { transform: scale(0.96); }
  .opcion.bien { background: #C9F2C7; border-color: #4CAF50; animation: saltar 0.5s; }
  .opcion.mal { background: #FFD6D6; border-color: #E57373; animation: temblar 0.4s; }
  @keyframes saltar { 30%{transform:scale(1.15)} }
  @keyframes temblar { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  .zona-armado { min-height: 100px; background: #fff; border: 4px dashed #F0B429; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 2.8rem; font-weight: bold; letter-spacing: 4px; color: #7B4EA8; margin: 14px auto; max-width: 440px; padding: 12px; }
  .silabas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .silaba { background: #FFE9A8; border: 4px solid #F0B429; border-radius: 18px; font-size: 2.4rem; font-weight: bold; padding: 16px 24px; cursor: pointer; font-family: inherit; color: #7A5C00; box-shadow: 0 5px 0 #D9A420; transition: transform 0.15s; }
  .silaba:active { transform: scale(0.94); }
  .silaba.usada { opacity: 0.25; pointer-events: none; }

  .celebracion { display: none; font-size: 1.8rem; font-weight: bold; color: #4CAF50; margin-top: 18px; animation: aparecer 0.4s; }
  .celebracion.ver { display: block; }
  @keyframes aparecer { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }

  .btn-siguiente { display: none; font-size: 1.4rem; background: #4CAF50; color: #fff; border: none; border-radius: 40px; padding: 18px 40px; cursor: pointer; font-family: inherit; font-weight: bold; margin-top: 14px; box-shadow: 0 4px 0 #2E7D32; }
  .btn-siguiente.ver { display: inline-block; }
  .btn-siguiente:active { transform: translateY(3px); box-shadow: 0 1px 0 #2E7D32; }

  .confeti { position: fixed; top: -20px; font-size: 2rem; animation: caer 2.2s linear forwards; pointer-events: none; z-index: 99; }
  @keyframes caer { to{transform:translateY(110vh) rotate(360deg)} }

  .frase { font-size: 2.1rem; font-weight: bold; line-height: 1.8; letter-spacing: 2px; margin: 14px 0; }
  .hueco { display: inline-block; min-width: 120px; border-bottom: 5px dashed #F0B429; color: #7B4EA8; }

  /* SOPA DE LETRAS */
  .palabras-buscar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 12px 0 18px; }
  .palabra-chip { background: #FFE9A8; border: 3px solid #F0B429; border-radius: 20px; padding: 10px 18px; font-size: 1.4rem; font-weight: bold; color: #7A5C00; transition: all 0.3s; }
  .palabra-chip.encontrada { background: #C9F2C7; border-color: #4CAF50; text-decoration: line-through; color: #2E7D32; }

  .sopa-grid { display: inline-grid; gap: 6px; margin: 0 auto 18px; }
  .sopa-celda { width: 64px; height: 64px; background: #fff; border: 3px solid #E8D8B0; border-radius: 14px; font-size: 1.8rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #4A3728; transition: all 0.15s; font-family: inherit; }
  .sopa-celda:active { transform: scale(0.92); }
  .sopa-celda.seleccionada { background: #FFE9A8; border-color: #F0B429; transform: scale(1.08); }
  .sopa-celda.encontrada-ok { background: #C9F2C7; border-color: #4CAF50; }
  .sopa-celda.error-sel { background: #FFD6D6; border-color: #E57373; animation: temblar 0.4s; }
  .sopa-puntaje { font-size: 1.3rem; color: #7B4EA8; font-weight: bold; margin-bottom: 10px; }

  #subir-nivel { display: none; position: fixed; inset: 0; background: rgba(123,78,168,0.93); z-index: 200; color: #fff; text-align: center; padding: 60px 24px; }
  #subir-nivel.ver { display: block; animation: aparecer 0.4s; }
  #subir-nivel .grande { font-size: 5rem; margin-bottom: 16px; }
  #subir-nivel h2 { font-size: 2.2rem; margin-bottom: 10px; }
  #subir-nivel p { font-size: 1.4rem; margin-bottom: 30px; }
  #subir-nivel button { font-size: 1.5rem; background: #F0B429; color: #5B4000; border: none; border-radius: 40px; padding: 18px 44px; font-family: inherit; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #C08F1A; }

  .reset { margin-top: 34px; font-size: 0.85rem; color: #C9B79C; background: none; border: none; font-family: inherit; cursor: pointer; text-decoration: underline; }
</style>

}
function borrarProgreso(){
  if(confirm('¿Borrar todo el progreso de Jazmín?')){
    prog={stars:0,sil:{n:1,a:0},pal:{n:1,a:0},fra:{n:1,a:0},sopa:{n:1,a:0}};
    guardarProgreso();
  }
}
function pintarMenu(){
  document.getElementById('stars').textContent=prog.stars;
  [['sil',NIVEL_MAX_SIL],['pal',NIVEL_MAX_PAL],['fra',NIVEL_MAX_FRA],['sopa',NIVEL_MAX_SOPA]].forEach(([k,max])=>{
    const p=prog[k];
    const ok=p.n>=max&&p.a>=META;
    document.getElementById('menu-'+k).textContent=ok?'¡Nivel '+max+' completado! 🏆':'Nivel '+p.n+' · '+p.a+' de '+META+' ⭐';
    document.getElementById('barra-'+k).style.width=Math.min(100,(p.a/META)*100)+'%';
  });
}

function mezclar(a){return [...a].sort(()=>Math.random()-0.5);}
function alAzar(lista){return lista[Math.floor(Math.random()*lista.length)];}
function irA(id){document.querySelectorAll('.pantalla').forEach(p=>p.classList.remove('activa'));document.getElementById(id).classList.add('activa');window.speechSynthesis&&speechSynthesis.cancel();}

function acierto(juego){
  prog.stars++;
  const p=prog[juego];
  const max=juego==='sil'?NIVEL_MAX_SIL:juego==='sopa'?NIVEL_MAX_SOPA:3;
  if(p.n<max||p.a<META)p.a++;
  confeti();
  if(p.a>=META&&p.n<max){p.n++;p.a=0;guardarProgreso();setTimeout(()=>mostrarSubida(p.n),1200);}
  else guardarProgreso();
}
function mostrarSubida(n){
  document.getElementById('sn-texto').textContent='¡Ahora estás en el Nivel '+n+'! ¡Cada vez sos más grande!';
  document.getElementById('subir-nivel').classList.add('ver');
  decir('¡Felicitaciones! ¡Subiste al nivel '+n+'!');
  confeti();setTimeout(confeti,600);
}
function cerrarNivel(){
  document.getElementById('subir-nivel').classList.remove('ver');
  const a=document.querySelector('.pantalla.activa').id;
  if(a==='silabas')cargarSilaba();
  if(a==='palabras')cargarPalabra();
  if(a==='frases')cargarFrase();
  if(a==='sopa-pantalla')cargarSopa();
}
function confeti(){
  const c=["🎉","⭐","✨","🌟","🎊"];
  for(let i=0;i<12;i++){
    const el=document.createElement('div');el.className='confeti';el.textContent=alAzar(c);
    el.style.left=Math.random()*95+'vw';el.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(el);setTimeout(()=>el.remove(),2800);
  }
}
function decir(texto){
  if(!window.speechSynthesis)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(texto);u.lang='es-ES';u.rate=0.75;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
if(window.speechSynthesis)speechSynthesis.getVoices();
function empezar(j){
  if(j==='sil'){cargarSilaba();irA('silabas');}
  if(j==='pal'){cargarPalabra();irA('palabras');}
  if(j==='fra'){cargarFrase();irA('frases');}
  if(j==='sopa'){cargarSopa();irA('sopa-pantalla');}
}

/* SÍLABAS */
function cargarSilaba(){
  silActual=alAzar(SILABAS[prog.sil.n]);silProgreso=0;
  document.getElementById('sil-nivel').textContent='Nivel '+prog.sil.n+' de '+NIVEL_MAX_SIL;
  document.getElementById('sil-dibujo').textContent=silActual.emoji;
  document.getElementById('sil-zona').innerHTML='&nbsp;';
  document.getElementById('sil-cele').classList.remove('ver');
  document.getElementById('sil-next').classList.remove('ver');
  const cont=document.getElementById('sil-fichas');cont.innerHTML='';
  mezclar(silActual.partes.map((s,i)=>({s,i}))).forEach(obj=>{
    const b=document.createElement('button');b.className='silaba';b.textContent=obj.s;
    b.onclick=()=>tocarSilaba(b,obj.i);cont.appendChild(b);
  });
  decir(silActual.palabra);
}
function tocarSilaba(btn,orden){
  if(orden===silProgreso){
    btn.classList.add('usada');silProgreso++;
    document.getElementById('sil-zona').textContent=silActual.partes.slice(0,silProgreso).join('');
    decir(silActual.partes[orden].toLowerCase());
    if(silProgreso===silActual.partes.length){
      setTimeout(()=>{decir("¡Correcto! Armaste la palabra: "+silActual.palabra+". ¡Muy bien Jazmín!");document.getElementById('sil-cele').classList.add('ver');document.getElementById('sil-next').classList.add('ver');acierto('sil');},600);
    }
  } else {btn.classList.add('mal');setTimeout(()=>btn.classList.remove('mal'),450);}
}

/* PALABRAS */
function cargarPalabra(){
  palActual=alAzar(PALABRAS[prog.pal.n]);
  document.getElementById('pal-nivel').textContent='Nivel '+prog.pal.n+' de '+NIVEL_MAX_PAL;
  document.getElementById('pal-dibujo').textContent=palActual.emoji;
  document.getElementById('pal-cele').classList.remove('ver');document.getElementById('pal-next').classList.remove('ver');
  const cont=document.getElementById('pal-opciones');cont.innerHTML='';
  mezclar([palActual.palabra,...palActual.falsas]).forEach(op=>{
    const b=document.createElement('button');b.className='opcion';b.textContent=op;
    b.onclick=()=>elegirPalabra(b,op);cont.appendChild(b);
  });
  decir(palActual.palabra);
}
function elegirPalabra(btn,op){
  if(op===palActual.palabra){btn.classList.add('bien');decir("¡Excelente! "+palActual.palabra);document.getElementById('pal-cele').classList.add('ver');document.getElementById('pal-next').classList.add('ver');document.querySelectorAll('#pal-opciones .opcion').forEach(o=>o.style.pointerEvents='none');acierto('pal');}
  else{btn.classList.add('mal');decir("Probá otra vez");setTimeout(()=>btn.classList.remove('mal'),450);}
}

/* FRASES */
function cargarFrase(){
  fraActual=alAzar(FRASES[prog.fra.n]);
  document.getElementById('fra-nivel').textContent='Nivel '+prog.fra.n+' de '+NIVEL_MAX_FRA;
  document.getElementById('fra-texto').innerHTML=fraActual.antes+' <span class="hueco" id="fra-hueco">&nbsp;</span>';
  document.getElementById('fra-cele').classList.remove('ver');document.getElementById('fra-next').classList.remove('ver');
  const cont=document.getElementById('fra-opciones');cont.innerHTML='';
  mezclar([{...fraActual.correcta,ok:true},...fraActual.falsas.map(f=>({...f,ok:false}))]).forEach(op=>{
    const b=document.createElement('button');b.className='opcion';b.textContent=op.t;
    b.onclick=()=>elegirFrase(b,op);cont.appendChild(b);
  });
  decirFrase();
}
function decirFrase(){decir(fraActual.antes+" ...");}
function elegirFrase(btn,op){
  if(op.ok){btn.classList.add('bien');document.getElementById('fra-hueco').textContent=op.t;decir("¡Genial! "+fraActual.leer);document.getElementById('fra-cele').classList.add('ver');document.getElementById('fra-next').classList.add('ver');document.querySelectorAll('#fra-opciones .opcion').forEach(o=>o.style.pointerEvents='none');acierto('fra');}
  else{btn.classList.add('mal');decir("Probá otra vez");setTimeout(()=>btn.classList.remove('mal'),450);}
}

/* SOPA */
function cargarSopa(){
  const set=alAzar(SOPAS[prog.sopa.n]);
  sopaPalabrasAct=[...set.palabras];sopaEncontradas=[];
  document.getElementById('sopa-nivel').textContent='Nivel '+prog.sopa.n+' de '+NIVEL_MAX_SOPA;
  document.getElementById('sopa-cele').classList.remove('ver');document.getElementById('sopa-next').classList.remove('ver');
  document.getElementById('sopa-enc').textContent='0';document.getElementById('sopa-total').textContent=sopaPalabrasAct.length;
  generarSopa();renderChips();
}
function generarSopa(){
  sopaData=Array.from({length:TAMANIO},()=>Array(TAMANIO).fill(''));
  for(const pal of sopaPalabrasAct){
    let ok=false;
    for(let t=0;t<300&&!ok;t++){
      const [dr,dc]=DIRS[Math.floor(Math.random()*DIRS.length)];
      const r=Math.floor(Math.random()*TAMANIO),c=Math.floor(Math.random()*TAMANIO);
      if(cabe(pal,r,c,dr,dc)){for(let i=0;i<pal.length;i++)sopaData[r+dr*i][c+dc*i]=pal[i];ok=true;}
    }
  }
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<TAMANIO;r++)for(let c=0;c<TAMANIO;c++)if(!sopaData[r][c])sopaData[r][c]=L[Math.floor(Math.random()*L.length)];
  renderGrilla();
}
function cabe(pal,r,c,dr,dc){
  for(let i=0;i<pal.length;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=TAMANIO||nc<0||nc>=TAMANIO)return false;if(sopaData[nr][nc]&&sopaData[nr][nc]!==pal[i])return false;}return true;
}
function renderGrilla(){
  const grid=document.getElementById('sopa-grid');
  grid.style.gridTemplateColumns=`repeat(${TAMANIO},1fr)`;grid.innerHTML='';sopaSeleccion=[];
  for(let r=0;r<TAMANIO;r++)for(let c=0;c<TAMANIO;c++){
    const cel=document.createElement('div');cel.className='sopa-celda';cel.textContent=sopaData[r][c];
    cel.dataset.r=r;cel.dataset.c=c;cel.onclick=()=>tocarCelda(cel,r,c);grid.appendChild(cel);
  }
}
function renderChips(){
  const cont=document.getElementById('sopa-chips');cont.innerHTML='';
  sopaPalabrasAct.forEach(p=>{
    const ch=document.createElement('div');ch.className='palabra-chip'+(sopaEncontradas.includes(p)?' encontrada':'');
    ch.id='chip-'+p;ch.textContent=p;cont.appendChild(ch);
  });
}
function tocarCelda(cel,r,c){
  if(cel.classList.contains('encontrada-ok'))return;
  const key=r+'-'+c;
  const ya=sopaSeleccion.findIndex(s=>s.key===key);
  if(ya>=0){sopaSeleccion.splice(ya,1);cel.classList.remove('seleccionada');return;}
  sopaSeleccion.push({key,r,c,cel});cel.classList.add('seleccionada');
  const texto=sopaSeleccion.map(s=>sopaData[s.r][s.c]).join('');
  const rev=[...texto].reverse().join('');
  const match=sopaPalabrasAct.find(p=>p===texto||p===rev);
  if(match&&!sopaEncontradas.includes(match)){
    sopaEncontradas.push(match);
    sopaSeleccion.forEach(s=>{s.cel.classList.remove('seleccionada');s.cel.classList.add('encontrada-ok');});
    sopaSeleccion=[];
    document.getElementById('sopa-enc').textContent=sopaEncontradas.length;
    document.getElementById('chip-'+match).classList.add('encontrada');
    decir("¡Encontraste "+match.toLowerCase()+"!");
    if(sopaEncontradas.length===sopaPalabrasAct.length){
      setTimeout(()=>{document.getElementById('sopa-cele').classList.add('ver');document.getElementById('sopa-next').classList.add('ver');acierto('sopa');},600);
    }
  } else if(texto.length>Math.max(...sopaPalabrasAct.map(p=>p.length))){
    sopaSeleccion.forEach(s=>{s.cel.classList.remove('seleccionada');s.cel.classList.add('error-sel');setTimeout(()=>s.cel.classList.remove('error-sel'),500);});
    sopaSeleccion=[];
  }
}
cargarProgreso();
</script>
